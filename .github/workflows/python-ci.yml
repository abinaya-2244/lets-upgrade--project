name: Python CI + Auto Format 🚀

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  python-ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Show Python version
        run: python --version

      - name: Install dependencies
        run: |
          pip install flake8 autopep8 pytest

      # 🔍 Lint check (non-blocking)
      - name: Run Lint Check
        run: flake8 . || true

      # 🔧 Auto format code
      - name: Auto Format Code
        run: autopep8 --in-place --aggressive --aggressive *.py

      # 🔄 Commit formatted code
      - name: Commit formatted code
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"
          git add .
          git commit -m "auto format code [CI]" || echo "No changes"
          git push

      # 🧪 Run tests (MAIN STEP)
      - name: Run Tests
        run: pytest

