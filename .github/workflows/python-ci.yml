name: Python CI Pipeline 🐍

on:
  push:
    branches: [ main ]

jobs:
  test-python:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Check Python version
        run: python --version

      - name: Install dependencies
        run: |
          pip install flake8

      - name: Lint code (quality check)
        run: flake8 .

      - name: Run script (basic validation)
        run: python your_file_name.py
