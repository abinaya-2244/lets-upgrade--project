<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Guessing Game 🎮</title>
  <style>
    body {
      text-align: center;
      font-family: Arial;
      margin-top: 50px;
      background: #222;
      color: white;
    }
    input, button {
      padding: 10px;
      font-size: 16px;
      margin: 10px;
    }
    #result {
      font-size: 20px;
      margin-top: 20px;
    }
  </style>
</head>
<body>

  <h1>🎮 Number Guessing Game</h1>
  <p>Guess a number between 1 and 100</p>

  <input type="number" id="guessInput" placeholder="Enter your guess">
  <button onclick="checkGuess()">Submit</button>

  <div id="result"></div>

  <script src="script.js"></script>

</body>
</html>
